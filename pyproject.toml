[project]
name = "mini-redis"
version = "0.1.0"
description = "A from-scratch Redis-compatible server in pure Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mini_redis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
